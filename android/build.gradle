// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id "org.sonarqube" version "7.5.0.8588"
}

sonar {
    properties {
        property "sonar.projectKey", "organization_project-key"
        property "sonar.organization", "organization-slug"
        property "sonar.projectName", "Cash Flow Intelligence"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.language", "java"
        property "sonar.sources", "app/src/main/java"
        property "sonar.java.binaries", "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes"
        property "sonar.sourceEncoding", "UTF-8"
        property "sonar.exclusions", "**/build/**,**/node_modules/**,**/*.min.js,**/dist/**"
        property "sonar.android.lint.reportPaths", "app/build/reports/lint-results-debug.xml"
        property "sonar.token", System.getenv("SONAR_TOKEN") ?: ""
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
